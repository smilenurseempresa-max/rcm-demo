<!DOCTYPE html>
<html lang="es" data-text="1" data-contrast="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCM · Prototipo completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1A; --surface:#111a2b; --surface-2:#16223a;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.20);
    --text:#EAF1FF; --muted:#9FB0CC; --faint:#5C6E8C;
    --pulse:#17E3A8; --blue:#2E86D6; --teal:#1F9FB0; --indigo:#3A5AC0; --purple:#6A4BD8;
    --danger:#FF6B6B;
    --ease:cubic-bezier(.22,.61,.36,1);
    --fs:1;               /* factor de tamaño de texto (accesibilidad) */
    --font-body:'Inter',system-ui,sans-serif;
    --font-head:'Space Grotesk',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  html[data-text="2"]{ --fs:1.15; }
  html[data-text="3"]{ --fs:1.32; }
  html[data-contrast="alto"]{
    --bg:#000; --surface:#0a0a0a; --surface-2:#141414;
    --text:#fff; --muted:#e6e6e6; --faint:#c9c9c9;
    --line:rgba(255,255,255,.4); --line-2:rgba(255,255,255,.6);
    --pulse:#28ffbe;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(120% 80% at 50% -5%, #101a2e 0%, var(--bg) 55%);
    color:var(--text); font-family:var(--font-body);
    font-size:calc(16px*var(--fs)); line-height:1.55; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:3px solid var(--pulse); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }

  .wrap{ max-width:640px; margin:0 auto; padding:76px 20px 60px; }

  /* ---------- Barra de accesibilidad ---------- */
  .a11y{
    position:fixed; top:12px; right:12px; z-index:50;
    display:flex; gap:8px; align-items:center;
    background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:6px 10px;
  }
  .a11y span{ font-size:11px; color:var(--faint); font-family:var(--font-mono); letter-spacing:.04em; }
  .a11y button{
    font-family:var(--font-body); color:var(--muted);
    background:transparent; border:1px solid var(--line-2); border-radius:8px;
    padding:4px 9px; cursor:pointer; font-weight:600; line-height:1;
  }
  .a11y button:hover,.a11y button[aria-pressed="true"]{ color:var(--bg); background:var(--text); }
  html[data-contrast="alto"] .a11y button:hover{ color:#000; }

  /* ---------- Splash: logo + pulsos ---------- */
  .logo-stage{ position:relative; width:min(72vw,300px); aspect-ratio:928 / 942; margin:0 auto; }
  .rcm-logo{ display:block; width:100%; height:100%; }
  .logo-pulse{ position:absolute; z-index:3; width:24%; aspect-ratio:1/1; border-radius:50%;
    transform:translate(-50%,-50%) scale(.5);
    background:radial-gradient(circle, rgba(166,236,255,.9) 0%, rgba(166,236,255,0) 62%);
    mix-blend-mode:screen; opacity:0; pointer-events:none;
    animation:rcm-pulse 2s ease-in-out infinite; }
  .p-brain  { left:50%; top:16%; animation-delay:0s; }
  .p-grafico{ left:66%; top:31%; animation-delay:.45s; }
  .p-escudo { left:50%; top:47%; animation-delay:.9s; }
  .p-lupa   { left:34%; top:31%; animation-delay:1.35s; }
  @keyframes rcm-pulse{ 0%,100%{opacity:0; transform:translate(-50%,-50%) scale(.5);} 50%{opacity:.95; transform:translate(-50%,-50%) scale(1.15);} }

  /* ---------- Screens ---------- */
  .screen{ display:none; animation:fade .35s var(--ease); }
  .screen.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .brand{ text-align:center; margin-bottom:8px; }
  .brand .mark{ font-family:var(--font-head); font-weight:700; font-size:2.4em; letter-spacing:.06em;
    background:linear-gradient(180deg,#fff,#9db6d8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  html[data-contrast="alto"] .brand .mark{ background:none; color:#fff; }
  .brand .sub{ font-size:.72em; letter-spacing:.22em; color:#7FA6DE; text-transform:uppercase; font-weight:600; }
  .lead{ text-align:center; color:var(--muted); margin:14px auto 30px; max-width:44ch; }

  h1,h2{ font-family:var(--font-head); font-weight:600; line-height:1.2; }
  .eyebrow{ font-family:var(--font-mono); font-size:.72em; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }

  .btn{ font-family:var(--font-body); font-weight:600; font-size:1em; color:#04140E;
    background:var(--pulse); border:none; border-radius:999px; padding:14px 28px; cursor:pointer;
    transition:transform .15s var(--ease), box-shadow .2s var(--ease); }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 8px 26px rgba(23,227,168,.28); }
  .btn.ghost{ background:transparent; color:var(--muted); border:1px solid var(--line-2); }
  .btn.ghost:hover{ color:var(--text); box-shadow:none; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .back{ background:none; border:none; color:var(--muted); font-family:var(--font-body); font-size:.9em;
    cursor:pointer; padding:6px 0; margin-bottom:18px; }
  .back:hover{ color:var(--text); }

  /* Tarjetas de elección */
  .choices{ display:grid; gap:16px; }
  @media(min-width:540px){ .choices.two{ grid-template-columns:1fr 1fr; } }
  .choice{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:22px; cursor:pointer; transition:.18s var(--ease); color:var(--text); font-family:var(--font-body); }
  .choice:hover{ border-color:var(--pulse); transform:translateY(-2px); background:var(--surface-2); }
  .choice .ic{ font-size:1.8em; display:block; margin-bottom:10px; }
  .choice h2{ font-size:1.25em; margin-bottom:4px; }
  .choice p{ color:var(--muted); font-size:.9em; }

  /* Formularios */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.85em; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .field input,.field select,.field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line-2); border-radius:12px;
    padding:12px 14px; color:var(--text); font-family:var(--font-body); font-size:1em; }
  .field textarea{ min-height:70px; resize:vertical; }
  .field .hint{ font-size:.78em; color:var(--faint); margin-top:5px; }
  .err-msg{ color:var(--danger); font-size:.85em; margin-top:8px; min-height:1.2em; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; }

  /* Lista de temas */
  .topic{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px 18px; cursor:pointer; color:var(--text);
    font-family:var(--font-body); margin-bottom:10px; transition:.15s var(--ease); }
  .topic:hover:not(:disabled){ border-color:var(--pulse); background:var(--surface-2); }
  .topic:disabled{ opacity:.5; cursor:default; }
  .topic .t-name{ font-weight:600; }
  .topic .t-tag{ font-family:var(--font-mono); font-size:.7em; letter-spacing:.06em; padding:3px 9px;
    border-radius:999px; border:1px solid var(--line-2); color:var(--faint); }
  .topic .t-tag.on{ color:var(--pulse); border-color:var(--pulse); }

  /* Motor de entrenamiento */
  .progress{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .track{ flex:1; height:6px; background:var(--surface); border-radius:4px; overflow:hidden; }
  .fill{ height:100%; background:var(--pulse); width:0; transition:width .4s var(--ease); }
  .count{ font-family:var(--font-mono); font-size:.75em; color:var(--faint); }
  .case{ background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:20px;
    text-align:center; margin-bottom:20px; }
  .case .q{ font-family:var(--font-head); font-size:1.2em; }
  .options{ display:grid; gap:10px; }
  .option{ text-align:left; background:var(--surface); border:1px solid var(--line-2); border-radius:12px;
    padding:14px 16px; cursor:pointer; color:var(--text); font-family:var(--font-body); font-size:1em;
    transition:.14s var(--ease); }
  .option:hover:not(.done){ border-color:var(--pulse); }
  .option.ok{ border-color:var(--pulse); background:rgba(23,227,168,.12); }
  .option.no{ border-color:var(--danger); background:rgba(255,107,107,.10); }
  .option.done{ cursor:default; }
  .num{ display:flex; gap:10px; }
  .num input{ flex:1; background:var(--surface); border:1px solid var(--line-2); border-radius:12px;
    padding:12px 14px; color:var(--text); font-size:1.1em; font-family:var(--font-mono); }
  .microcalc{ text-align:center; color:var(--faint); font-size:.8em; margin-top:16px; }

  /* Científico loco */
  .prof{ display:flex; gap:14px; align-items:flex-start; background:var(--surface-2);
    border:1px solid var(--purple); border-radius:16px; padding:16px; margin-top:18px;
    animation:pop .3s var(--ease); }
  @keyframes pop{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:none;} }
  .prof .avatar{ font-size:2em; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 8px rgba(106,75,216,.5)); }
  .prof .bubble b{ color:var(--pulse); }
  .prof .bubble .who{ font-family:var(--font-mono); font-size:.7em; letter-spacing:.08em; color:var(--purple);
    text-transform:uppercase; display:block; margin-bottom:4px; }

  /* Resultado */
  .rrow{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
  .stars b{ color:var(--pulse); font-size:1.1em; }
  .stars .off{ color:var(--faint); }
  .mastery{ text-align:center; margin:22px 0; }
  .mastery .v{ font-family:var(--font-head); font-size:2.6em; color:var(--pulse); }

  /* Panel docente */
  .tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab{ background:var(--surface); border:1px solid var(--line-2); border-radius:999px; padding:8px 16px;
    cursor:pointer; color:var(--muted); font-family:var(--font-body); font-weight:600; font-size:.9em; }
  .tab[aria-selected="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); }
  html[data-contrast="alto"] .tab[aria-selected="true"]{ color:#000; }
  .roster{ width:100%; border-collapse:collapse; font-size:.9em; }
  .roster th,.roster td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  .roster th{ font-size:.75em; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; }
  .dot.mastery{ background:var(--pulse); } .dot.competent{ background:var(--blue); }
  .dot.training{ background:#FFB142; } .dot.locked{ background:var(--faint); }
  .pill{ font-family:var(--font-mono); font-size:.72em; color:var(--danger); border:1px solid rgba(255,107,107,.4);
    border-radius:999px; padding:2px 8px; }
  .saved{ background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--pulse);
    border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:.9em; }
  .note{ background:rgba(106,75,216,.08); border:1px solid rgba(106,75,216,.4); border-radius:12px;
    padding:14px; font-size:.85em; color:var(--muted); margin-top:10px; }
  .row2{ display:grid; gap:12px; }
  @media(min-width:540px){ .row2{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>

<!-- Barra de accesibilidad (siempre visible) -->
